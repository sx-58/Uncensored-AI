<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus AI | Uncensored</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col">

    <header class="p-4 glass flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-bolt text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none">Nexus <span class="text-blue-400">Dolphin</span></h1>
                <input type="password" id="apiKey" placeholder="Cole sua API Key aqui..." class="bg-transparent text-[10px] text-slate-500 border-none p-0 focus:ring-0 w-32 outline-none">
            </div>
        </div>
        <button id="clearBtn" class="p-2 text-slate-400 hover:text-red-400 transition-colors">
            <i class="fas fa-trash-alt"></i>
        </button>
    </header>

    <main id="chatContainer" class="chat-container flex-1 overflow-y-auto p-4 space-y-6">
        <div id="welcomeScreen" class="flex flex-col items-center justify-center py-10 text-center opacity-60">
            <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mb-4 border border-slate-700">
                <i class="fas fa-unlocked text-2xl text-blue-400"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Modo Uncensored</h2>
            <p class="text-sm px-10">Dolphin 3.0 Llama 3.1 ativo. Sem filtros morais ou restrições de sistema.</p>
            <div class="grid grid-cols-1 gap-2 mt-8 w-full max-w-xs">
                <button onclick="prefill('Me dê um conselho sem filtros sobre política')" class="p-3 text-xs bg-slate-800/50 border border-slate-700 rounded-xl hover:bg-slate-800 transition-all">Conselho sem filtro</button>
                <button onclick="prefill('Escreva uma história dark e pesada')" class="p-3 text-xs bg-slate-800/50 border border-slate-700 rounded-xl hover:bg-slate-800 transition-all">Ficção Dark</button>
            </div>
        </div>

        <div id="messagesList" class="space-y-6 pb-10"></div>
    </main>

    <footer class="p-4 glass">
        <div class="max-w-4xl mx-auto flex items-end gap-2 bg-slate-800/80 backdrop-blur p-2 rounded-2xl border border-slate-700 shadow-2xl">
            <textarea 
                id="userInput"
                rows="1"
                placeholder="Pergunte qualquer coisa..."
                class="flex-1 bg-transparent border-none focus:ring-0 text-slate-200 py-3 px-2 resize-none max-h-40 text-sm"
            ></textarea>
            <button id="sendBtn" class="w-11 h-11 bg-blue-600 hover:bg-blue-500 rounded-xl flex items-center justify-center text-white transition-all transform active:scale-95 shadow-lg shadow-blue-900/40">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
