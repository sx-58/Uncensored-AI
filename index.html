<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus IA | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <div class="flex h-screen w-full overflow-hidden">
        
        <aside id="sidebar" class="sidebar flex flex-col border-r border-zinc-800 bg-[#0c0c0e]">
            <div class="p-4 flex flex-col h-full min-w-[280px]">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-2 font-bold text-xl tracking-tight">
                        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-robot text-white text-sm"></i>
                        </div>
                        <span>Nexus IA</span>
                    </div>
                    <button onclick="toggleSidebar()" class="p-2 hover:bg-zinc-800 rounded-lg md:hidden">
                        <i class="fas fa-times text-zinc-400"></i>
                    </button>
                </div>

                <button onclick="newChat()" class="flex items-center gap-3 p-3 rounded-xl border-2 border-zinc-800 hover:bg-zinc-800 bg-zinc-900/50 transition-all mb-8 shadow-sm">
                    <i class="fas fa-plus text-indigo-500 text-sm"></i>
                    <span class="font-semibold text-sm text-indigo-500">Novo Chat</span>
                </button>

                <div class="flex-1 overflow-y-auto space-y-1 custom-scrollbar">
                    <p class="text-[10px] font-bold text-zinc-500 mb-3 px-2 uppercase tracking-widest">Histórico Recente</p>
                    <div class="history-item">
                        <i class="far fa-message text-zinc-500"></i>
                        <span class="truncate">Design de Interface IA</span>
                    </div>
                </div>

                <div class="mt-auto pt-4 border-t border-zinc-800/50">
                    <div class="flex items-center gap-3 p-2.5 rounded-2xl bg-zinc-900/80 border border-zinc-800">
                        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold">JD</div>
                        <div class="flex-1 overflow-hidden text-xs">
                            <p class="font-bold truncate">João Designer</p>
                            <p class="text-indigo-400">Plano Premium</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative bg-[#09090b]">
            <header class="h-16 border-b border-zinc-800/50 px-6 flex items-center justify-between backdrop-blur-xl">
                <div class="flex items-center gap-4">
                    <button id="openSidebar" onclick="toggleSidebar()" class="p-2 rounded-xl bg-zinc-800 text-white border border-zinc-700 hidden">
                        <i class="fas fa-bars text-indigo-500"></i>
                    </button>
                    <div class="flex flex-col">
                        <h2 class="text-sm font-bold">Assistente Nexus</h2>
                        <div class="flex items-center gap-1.5">
                            <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                            <span class="text-[10px] text-zinc-500 font-medium">Venice Online - Llama 3.1</span>
                        </div>
                    </div>
                </div>
                <button onclick="toggleTheme()" class="p-2 rounded-xl border border-zinc-800 text-yellow-500">
                    <i class="fas fa-sun"></i>
                </button>
            </header>

            <div id="chatArea" class="flex-1 overflow-y-auto p-4 md:p-10 space-y-10 custom-scrollbar">
                <div id="messagesList" class="max-w-4xl mx-auto">
                    </div>
            </div>

            <div class="p-6 md:pb-10">
                <form id="chatForm" class="max-w-4xl mx-auto relative flex items-center gap-3 p-3 rounded-2xl border-2 border-zinc-800 bg-zinc-900/50 focus-within:border-indigo-500/50 transition-all">
                    <button type="button" class="p-2.5 text-zinc-500 hover:text-white"><i class="fas fa-paperclip"></i></button>
                    <input id="userInput" type="text" placeholder="Pergunta qualquer coisa à Nexus..." class="flex-1 bg-transparent border-none focus:ring-0 text-sm md:text-base font-medium py-2 text-white outline-none">
                    <button type="submit" id="sendBtn" class="p-3 bg-indigo-600 text-white rounded-xl shadow-lg opacity-50 cursor-not-allowed">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
                <div class="flex justify-center gap-4 mt-4 overflow-x-auto no-scrollbar py-1">
                    <button onclick="prefill('Sugerir código')" class="chip">Sugerir código</button>
                    <button onclick="prefill('Gerar roteiro')" class="chip">Gerar roteiro</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
