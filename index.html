<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus AI | Uncensored</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        <header class="top-header">
            <div class="header-content">
                <div class="flex items-center gap-3">
                    <div class="logo-box">
                        <i class="fas fa-bolt text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base leading-none">Nexus <span class="text-blue-400">AI</span></h1>
                        <p class="text-[9px] text-slate-500 uppercase">Uncensored Engine</p>
                    </div>
                </div>
                <button id="clearBtn" class="p-2 text-slate-500"><i class="fas fa-trash-alt"></i></button>
            </div>
        </header>

        <main id="chatContainer" class="chat-main">
            <div id="welcomeScreen" class="welcome-center">
                <h1 class="text-3xl font-bold mb-8">Como posso ajudar?</h1>
                <div class="suggestions-grid">
                    <button onclick="prefill('Criar roteiro dark')" class="suggest-item">
                        <i class="fas fa-pen-nib text-blue-400"></i>
                        <span>Criar roteiro dark</span>
                    </button>
                    <button onclick="prefill('Explorar vulnerabilidades')" class="suggest-item">
                        <i class="fas fa-unlock-alt text-purple-400"></i>
                        <span>Explorar vulnerabilidades</span>
                    </button>
                </div>
            </div>
            <div id="messagesList" class="messages-list"></div>
        </main>

        <footer class="input-footer">
            <div class="input-container">
                <textarea id="userInput" rows="1" placeholder="Pergunte ao Nexus..."></textarea>
                <button id="sendBtn" class="send-circle">
                    <i class="fas fa-arrow-up text-black"></i>
                </button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
