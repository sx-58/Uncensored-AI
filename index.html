<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <header class="app-header">
            <button class="header-btn"><i class="fas fa-bars"></i></button>
            <div class="header-title">Nexus AI <i class="fas fa-chevron-down text-[10px] opacity-40"></i></div>
            <button class="header-btn"><i class="far fa-edit"></i></button>
        </header>

        <main id="chatArea" class="chat-container">
            <div id="welcome" class="welcome-screen">
                <h1 class="welcome-msg">Como posso ajudar?</h1>
                <div class="suggest-grid">
                    <button onclick="prefill('Criar imagem')" class="s-card"><i class="fas fa-image text-green-500"></i> Criar imagem</button>
                    <button onclick="prefill('Analisar imagens')" class="s-card"><i class="fas fa-eye text-blue-500"></i> Analisar imagens</button>
                    <button onclick="prefill('Resumir texto')" class="s-card"><i class="fas fa-file-alt text-orange-400"></i> Resumir texto</button>
                    <button onclick="prefill('Aconselhar')" class="s-card"><i class="fas fa-graduation-cap text-cyan-400"></i> Aconselhar</button>
                </div>
            </div>
            <div id="messagesList"></div>
        </main>

        <footer class="input-footer">
            <div class="input-box">
                <button class="plus-btn"><i class="fas fa-plus"></i></button>
                <input type="text" id="userInput" placeholder="Pergunta ao Nexus..." autocomplete="off">
                <button id="sendBtn" class="send-action"><i class="fas fa-arrow-up"></i></button>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
