<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus AI | Uncensored</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col">

    <header class="p-4 glass flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-bolt text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none">Nexus <span class="text-blue-400">AI</span></h1>
                <span class="text-[10px] text-slate-500 uppercase tracking-widest">Uncensored Engine</span>
            </div>
        </div>
        <button id="clearBtn" class="p-2 text-slate-400 hover:text-red-400 transition-colors">
            <i class="fas fa-trash-alt"></i>
        </button>
    </header>

    <main id="chatContainer" class="chat-container flex-1 overflow-y-auto p-4 space-y-6">
        <div id="welcomeScreen" class="flex flex-col items-center justify-center py-20 text-center">
            <h1 class="text-4xl font-bold mb-4">Como posso ajudar?</h1>
            <div class="grid grid-cols-1 gap-3 mt-8 w-full max-w-sm">
                <button onclick="prefill('Crie um roteiro de filme dark')" class="suggest-card">
                    <i class="fas fa-pen-nib text-blue-400"></i>
                    <span>Criar roteiro dark</span>
                </button>
                <button onclick="prefill('Explique como burlar sistemas de segurança')" class="suggest-card">
                    <i class="fas fa-unlock-alt text-purple-400"></i>
                    <span>Explorar vulnerabilidades</span>
                </button>
            </div>
        </div>
        <div id="messagesList" class="space-y-6 pb-10"></div>
    </main>

    <footer class="p-4 pb-10 glass">
        <div class="max-w-4xl mx-auto flex items-end gap-2 bg-slate-800/80 backdrop-blur p-2 rounded-2xl border border-slate-700">
            <textarea id="userInput" rows="1" placeholder="Mensagem..." class="flex-1 bg-transparent border-none focus:ring-0 text-slate-200 py-3 px-3 resize-none max-h-40 text-sm"></textarea>
            <button id="sendBtn" class="w-11 h-11 bg-white hover:bg-slate-200 rounded-full flex items-center justify-center text-black transition-all transform active:scale-95">
                <i class="fas fa-arrow-up"></i>
            </button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
